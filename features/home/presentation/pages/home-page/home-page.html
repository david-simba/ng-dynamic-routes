  @for (card of cards; track $index) {
    <app-card
      [id]="card.id"
      [title]="card.title"
      [description]="card.description"
      [isFavorite]="card.isFavorite"
      (onToggleFavorite)="onToggleFavorite($event)"
      (onShowProduct)="onShowDetails($event)"
    >
    </app-card>
  }
</div>
